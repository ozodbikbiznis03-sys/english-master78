<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>english MASTER😂</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f6fa;--sf:#fff;--tx:#112233;--mu:#6b7b8a;--bd:#d5dfe9;--pc:#e6f7ec;--ok:#46a302;--no:#ef4444;--bl:#1cb0f6;--bls:#1899d6;--gr:#58cc02;--grs:#46a302;--gy:#94a3b8;--gys:#748397;--box-sizing:border-box;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111c26;--sf:#16232e;--tx:#f1f5f9;--mu:#8aa0b4;--bd:#2a3a4d;--pc:#0f2a1c}}
:root[data-theme="dark"]{--bg:#111c26;--sf:#16232e;--tx:#f1f5f9;--mu:#8aa0b4;--bd:#2a3a4d;--pc:#0f2a1c}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:600 16px/1.35 Nunito,system-ui,"Noto Sans Arabic","Noto Sans SC",sans-serif;transition:background .3s}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;text-align:start}
:focus-visible{outline:3px solid #ffc800;outline-offset:2px}
#app{max-width:520px;margin:0 auto;padding:12px 16px 40px}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--bl),#58cc02);display:grid;place-items:center;font-weight:800;color:#fff;font-size:20px;flex:none}
.hd h2{margin:0;font-size:20px;font-weight:800;letter-spacing:.03em;flex:1}.hd h2 small{display:block;color:var(--gr);font-size:14px}
.ic{width:38px;height:38px;border-radius:50%;font-size:20px;display:grid;place-items:center}
.pc{background:var(--pc);border:2px solid var(--bd);border-radius:22px;padding:14px 18px;margin-bottom:14px}
.pc .r{display:flex;justify-content:space-between;align-items:end}.pc big{font-size:34px;font-weight:800}
.pc .s{font-size:14px}.bar{height:12px;border-radius:9px;background:var(--bd);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gr),#a6ee52,var(--gr));background-size:200% 100%;animation:shm 2s linear infinite;border-radius:9px;transition:width .6s}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.bg{display:grid;grid-template-columns:1fr 92px;gap:12px;margin-bottom:12px}
.tile{position:relative;display:flex;align-items:center;gap:10px;min-height:64px;padding:10px 12px;border:2px solid var(--bd);background:var(--sf);border-radius:22px;font-weight:800;transition:transform .12s}
.tile s{flex:none;width:36px;height:36px;border-radius:14px 6px 14px 14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent);text-decoration:none}
.bd{position:absolute;top:-6px;inset-inline-end:-4px;background:#ff4b4b;color:#fff;border-radius:99px;padding:0 7px;font-size:13px}
.big{position:relative;min-height:112px;padding:16px;border-radius:22px;color:#fff;font-weight:800;font-size:20px;transition:transform .12s,box-shadow .12s;display:flex;flex-direction:column;justify-content:space-between}
.big small{font-weight:600;font-size:14px;opacity:.92}.big u{position:absolute;inset-inline-end:14px;top:14px;width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;text-decoration:none;font-size:22px}
.blue{background:var(--bl);box-shadow:0 6px 0 var(--bls)}.green{background:var(--gr);box-shadow:0 6px 0 var(--grs)}.gray{background:var(--gy);box-shadow:0 6px 0 var(--gys)}
.sq{display:grid;place-items:center;text-align:center;padding:8px;font-size:32px}.sq b{font-size:13px}
.tile:active{transform:scale(.96)}.big:active{transform:translateY(5px);box-shadow:0 1px 0 #0003}
.card{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--sf);border:2px solid var(--bd);border-radius:18px;padding:10px 14px;margin-bottom:8px}
.card b{font-size:18px;font-weight:800}.card small{color:var(--mu)}
.row{display:flex;gap:8px;margin-bottom:12px}
input[type=text]{flex:1;min-width:0;padding:11px 14px;border-radius:14px;border:2px solid var(--bd);background:var(--sf)}
.cta{padding:12px 18px;border-radius:16px;background:var(--gr);box-shadow:0 4px 0 var(--grs);color:#fff;font-weight:800;text-align:center}.cta:active{transform:translateY(3px);box-shadow:0 1px 0 var(--grs)}
.word{font-size:clamp(30px,9vw,44px);font-weight:800;text-align:center;margin:18px 0 8px}
.opt{display:block;width:100%;margin-bottom:10px;padding:14px 16px;border-radius:18px;border:2px solid var(--bd);background:var(--sf);font-weight:800;transition:transform .12s}
.opt.ok{border-color:var(--gr);background:color-mix(in srgb,var(--gr) 20%,var(--sf));animation:pop .35s}.opt.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 16%,var(--sf));animation:sh .3s}
@keyframes pop{50%{transform:scale(1.04)}}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.mid{text-align:center}.gm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hl{border-color:var(--bl)!important;background:color-mix(in srgb,var(--bl) 22%,var(--sf))!important;transition:background .3s}
.tl{aspect-ratio:1;border-radius:16px;background:var(--bl);color:transparent;display:grid;place-items:center;text-align:center;font-size:13px;font-weight:800;padding:4px;transition:transform .3s}
.tl.up{background:var(--sf);color:var(--tx);border:2px solid var(--bl);transform:rotateY(360deg)}.tl.dn{background:color-mix(in srgb,var(--gr) 24%,var(--sf));color:var(--tx);border:2px solid var(--gr)}
details{background:var(--sf);border:2px solid var(--bd);border-radius:18px;padding:12px 16px;margin-bottom:8px}summary{cursor:pointer;font-weight:800}
.in{animation:rise .55s both cubic-bezier(.2,.9,.3,1.25)}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.93)}}@keyframes shm{to{background-position:-200% 0}}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(600px 420px at 8% 0,#1cb0f655,transparent),radial-gradient(520px 420px at 100% 35%,#58cc0244,transparent),radial-gradient(520px 520px at 30% 100%,#b57bff44,transparent);animation:drift 12s ease-in-out infinite alternate}
@keyframes drift{to{transform:scale(1.2) translate(-24px,22px)}}
.green{animation:glow 2.4s infinite}@keyframes glow{0%{box-shadow:0 6px 0 var(--grs),0 0 0 0 #58cc0288}70%,100%{box-shadow:0 6px 0 var(--grs),0 0 0 16px #58cc0200}}
.gt{font-size:26px;font-weight:800;text-align:center;margin-bottom:12px;background:linear-gradient(90deg,var(--bl),#58cc02,#ffc800);-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise .5s both}
.fl{display:inline-block;animation:wg 1.6s ease-in-out infinite}@keyframes wg{50%{transform:rotate(-6deg) scale(1.12)}}
.av{animation:wg 3s ease-in-out infinite}.word{animation:rise .4s both}
@media(hover:hover){.tile:hover{transform:translateY(-3px)}.opt:hover{transform:scale(1.02)}}
:root[data-theme="duo"]{--bg:#e9f0f7;--sf:#16232e;--tx:#112233;--mu:#5d7183;--bd:#2a3a4d;--pc:#0f2a1c}
[data-theme="duo"] :is(.tile,.card,.opt,.pc,details,input,select,.tl.up,.tl.dn){color:#f1f5f9}[data-theme="duo"] .card small{color:#8aa0b4}
.tb{margin:-4px -16px 14px;text-align:center;overflow:hidden;padding:10px 0 6px;border-radius:0 0 26px 26px;background:linear-gradient(120deg,#1cb0f628,#58cc0228,#ffc80028)}
.mq{display:flex;width:max-content;animation:mq 40s linear infinite;color:var(--mu);font-size:14px;white-space:nowrap}.mq span{padding-inline-end:28px}
@keyframes mq{to{transform:translateX(-50%)}}@keyframes mqr{to{transform:translateX(50%)}}
.tb h1{margin:6px 0 2px;font-size:32px;font-weight:800;background:linear-gradient(90deg,var(--bl),#58cc02,#ffc800,var(--bl));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shm 6s linear infinite}
.chip{padding:8px 14px;border-radius:99px;border:2px solid var(--bd);background:var(--sf);font-weight:800}
.lst,.bk{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-bottom:12px}.lst .card,.bk .tile{margin:0!important}
.ab{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px;margin-top:14px}
.lt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:20px;border:2px solid var(--bd);background:var(--sf);text-align:center;animation:rise .5s both;transition:transform .15s,border-color .2s}
.lt b{font-size:26px;font-weight:800}.lt small{font-size:13px;color:var(--mu)}.lt:hover{transform:translateY(-5px) rotate(-2deg);border-color:var(--bl)}
.card{animation:rise .45s both}.card:nth-child(3n+2){animation-delay:.05s}.card:nth-child(3n){animation-delay:.1s}.lt:nth-child(4n+2){animation-delay:.04s}.lt:nth-child(4n+3){animation-delay:.08s}.lt:nth-child(4n){animation-delay:.12s}
@keyframes fl{to{transform:translateY(-115vh) rotate(360deg)}}
.nv{display:none;gap:8px;margin:-4px 0 16px;flex-wrap:wrap}.nv button{padding:8px 16px;border-radius:99px;border:2px solid var(--bd);background:var(--sf);font-weight:800;transition:transform .2s,background .2s}.nv button:hover{transform:translateY(-2px)}.nv .on{background:var(--bl);color:#fff;border-color:var(--bl)}
[data-theme="duo"] :is(.chip,.lt,.nv button:not(.on)){color:#f1f5f9}[data-theme="duo"] .lt small{color:#8aa0b4}
.opt{max-width:720px;margin-inline:auto}
@media(min-width:900px){#app{max-width:1140px;padding:18px 36px 60px}.nv{display:flex}
.hm{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;grid-auto-flow:dense}.hm>.tb,.hm>.gt,.hm>.pc{grid-column:1/-1;margin-inline:0}.hm>.tb{border-radius:26px}.hm .g2,.hm .bg{display:contents}.hm .big{grid-column:span 2;min-height:150px}.hm .tile{min-height:80px;font-size:17px;margin:0}
.tile:hover,.big:hover{transform:translateY(-5px) rotate(-.6deg)}.word{font-size:64px}.tb h1{font-size:48px}.gt{font-size:34px}.hd h2{font-size:24px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Desktop enhancement: keeps the original visual language but gives large screens more room. */
@media(min-width:1200px){
  #app{max-width:1440px;padding:22px 48px 80px}
  .hm{grid-template-columns:repeat(5,1fr);gap:16px}
  .hm .big{grid-column:span 2;min-height:165px}
  .hm .tile{min-height:92px}
  .lst,.bk{grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px}
  .ab{grid-template-columns:repeat(8,minmax(110px,1fr));gap:14px}
  .card{padding:14px 16px}
  .word{font-size:76px}
}
@media(min-width:900px){
  html{direction:ltr!important}body{direction:ltr;overflow-x:hidden}
  .nv{position:sticky;top:10px;z-index:20;padding:8px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);border-radius:18px}
}

/* Animated background dragon */
.dragon-bg{
  position:fixed;right:-90px;bottom:2vh;width:min(420px,34vw);height:330px;
  z-index:-1;pointer-events:none;opacity:.28;filter:drop-shadow(0 0 16px #6d28d9);
  animation:dragonFloat 7s ease-in-out infinite;
}
.dragon-bg .body{position:absolute;right:70px;bottom:95px;width:145px;height:92px;border-radius:52% 46% 42% 55%;
  background:linear-gradient(145deg,#263238,#5b21b6 55%,#111827);transform:rotate(-8deg)}
.dragon-bg .head{position:absolute;right:195px;bottom:155px;width:92px;height:74px;border-radius:48% 58% 40% 42%;
  background:linear-gradient(145deg,#111827,#7c3aed);transform:rotate(-12deg)}
.dragon-bg .head:before,.dragon-bg .head:after{content:"";position:absolute;top:22px;width:10px;height:10px;border-radius:50%;background:#facc15;box-shadow:0 0 10px #facc15}
.dragon-bg .head:before{left:22px}.dragon-bg .head:after{right:22px}
.dragon-bg .horn{position:absolute;width:22px;height:54px;background:#111827;border-radius:70% 20% 60% 20%;top:-38px}
.dragon-bg .horn.h1{left:12px;transform:rotate(-28deg)}.dragon-bg .horn.h2{right:12px;transform:rotate(28deg)}
.dragon-bg .wing{position:absolute;width:125px;height:110px;background:linear-gradient(135deg,#111827,#4c1d95);clip-path:polygon(0 100%,22% 5%,48% 42%,75% 0,100% 100%,55% 70%);
  right:112px;bottom:150px;transform:rotate(8deg);transform-origin:bottom right;animation:wingFlap 1.7s ease-in-out infinite}
.dragon-bg .tail{position:absolute;right:-50px;bottom:76px;width:310px;height:72px;border-bottom:18px solid #4c1d95;border-radius:0 0 100% 100%;
  transform:rotate(8deg);animation:tailMove 2.5s ease-in-out infinite}
.dragon-bg .tail:after{content:"";position:absolute;right:-12px;bottom:-20px;width:0;height:0;border-left:40px solid #7c3aed;border-top:24px solid transparent;border-bottom:24px solid transparent}
.dragon-bg .fire{position:absolute;right:245px;bottom:130px;font-size:28px;animation:fireFlicker .35s ease-in-out infinite alternate}
@keyframes dragonFloat{50%{transform:translate(-18px,-16px) rotate(-2deg)}}
@keyframes wingFlap{50%{transform:rotate(22deg) scaleY(.82)}}
@keyframes tailMove{50%{transform:rotate(-4deg) translateY(-9px)}}
@keyframes fireFlicker{to{transform:scale(1.25) rotate(4deg);filter:brightness(1.5)}}
@media(max-width:700px){.dragon-bg{width:270px;height:220px;right:-95px;bottom:4vh;opacity:.16}}
@media(prefers-reduced-motion:reduce){.dragon-bg,.dragon-bg *{animation:none!important}}

/* Professional news / study hub */
.news-panel{background:var(--sf);border:2px solid var(--bd);border-radius:24px;padding:16px;margin-top:14px;box-shadow:0 12px 35px #0000000d}
.news-head{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.news-head h2{margin:0;font-size:24px}.news-actions{display:flex;gap:8px;flex-wrap:wrap}
.news-btn{padding:9px 13px;border-radius:14px;border:2px solid var(--bd);background:var(--sf);font-weight:800}
.news-btn.primary{background:var(--bl);border-color:var(--bl);color:#fff}
.news-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;margin-top:12px}
.news-card{border:2px solid var(--bd);border-radius:18px;padding:14px;background:linear-gradient(145deg,var(--sf),color-mix(in srgb,var(--bl) 5%,var(--sf)));transition:transform .2s,box-shadow .2s}
.news-card:hover{transform:translateY(-4px);box-shadow:0 10px 25px #00000012}
.news-card h3{margin:7px 0;font-size:18px}.news-card p{margin:7px 0;color:var(--mu)}
.news-meta{font-size:12px;color:var(--mu);display:flex;gap:8px;flex-wrap:wrap}
.news-tag{display:inline-block;padding:4px 8px;border-radius:99px;background:color-mix(in srgb,var(--gr) 18%,var(--sf));font-size:12px;font-weight:800}
.news-read{display:inline-block;margin-top:8px;color:var(--bl);font-weight:800;text-decoration:none}
.study-loop{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:12px}
.loop-card{padding:14px;border:2px solid var(--bd);border-radius:18px;background:var(--sf)}
.loop-card b{display:block;margin-bottom:4px}.loop-card small{color:var(--mu)}
.news-status{font-size:13px;color:var(--mu);margin-top:8px}
@media(min-width:900px){.news-panel{padding:22px}.news-head h2{font-size:28px}}


/* v2 upgrade */
#app{padding-bottom:150px!important}
.tb h1,.gt,.big,.hd h2,.word{font-family:Fredoka,Nunito,sans-serif}
.tb{background:linear-gradient(120deg,#1cb0f640,#58cc0238,#ffc80040);border:2px solid #fff6;box-shadow:0 14px 40px #1cb0f618}
.tile,.card,.lt,.news-panel,.pc,details{backdrop-filter:blur(10px);background:color-mix(in srgb,var(--sf) 84%,transparent)}
.tile{box-shadow:0 8px 22px #1cb0f612}.tile:hover,.lt:hover{border-color:var(--bl);box-shadow:0 14px 30px #1cb0f62e}
.big.blue{background:linear-gradient(135deg,var(--bl),#4f7cff)}.big.green{background:linear-gradient(135deg,#6ada10,#2fb344)}.big.gray{background:linear-gradient(135deg,#a0aec0,#718096)}
.chip.on{background:var(--bl);color:#fff;border-color:var(--bl)}
.sgz{min-height:64px;padding:10px;border:2px dashed var(--bl);border-radius:18px;display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;align-content:flex-start}
.wc{padding:9px 14px;border-radius:14px;border:2px solid var(--bd);background:var(--sf);font-weight:800;box-shadow:0 4px 0 var(--bd);transition:transform .12s}
.wc:active{transform:translateY(3px);box-shadow:none}.sgz .wc[data-a]{border-color:var(--bl);box-shadow:0 4px 0 var(--bls)}
[data-theme="duo"] .wc{color:#f1f5f9}

#pd{position:fixed;right:8px;bottom:6px;width:150px;z-index:40;cursor:pointer;-webkit-tap-highlight-color:transparent}
#pd #pcv{position:relative;width:150px;height:150px;border-radius:50%;overflow:hidden;border:4px solid #fff;box-shadow:0 10px 28px #0004;background:#dfefff;animation:girlFloat 3s ease-in-out infinite}
#pd #pcv img{width:100%;height:100%;display:block;object-fit:cover;object-position:43% 42%;transform:scale(1.34);transform-origin:center}
#pd.talk #pcv{animation:girlTalk .35s ease-in-out infinite alternate}
#pd .wave-hand{position:absolute;right:-2px;top:-12px;font-size:48px;line-height:1;filter:drop-shadow(0 4px 4px #0003);opacity:0;transform:translateY(18px) rotate(18deg) scale(.7);transform-origin:70% 80%;pointer-events:none}
#pd.wave .wave-hand{opacity:1;animation:handWave .9s ease-in-out 2}
#pd.yay #pcv{animation:girlYay .7s}
#pd.oops #pcv{animation:girlOops .5s}
@keyframes girlFloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-7px) rotate(1deg)}}
@keyframes girlTalk{from{transform:translateY(-2px) scale(1)}to{transform:translateY(-5px) scale(1.025)}}
@keyframes girlYay{0%{transform:scale(1)}45%{transform:scale(1.08) rotate(-2deg)}100%{transform:scale(1)}}
@keyframes girlOops{0%,100%{transform:translateX(0)}30%{transform:translateX(-5px)}70%{transform:translateX(5px)}}
@keyframes handWave{0%{transform:translateY(18px) rotate(18deg) scale(.7)}20%{transform:translateY(0) rotate(-18deg) scale(1)}45%{transform:translateY(-2px) rotate(20deg) scale(1.05)}70%{transform:translateY(0) rotate(-12deg) scale(1)}100%{transform:translateY(18px) rotate(18deg) scale(.7)}}
@media(max-width:600px){#pd{width:104px}#pd #pcv{width:104px;height:104px}#pd .wave-hand{font-size:38px;right:-6px;top:-10px}}

#pd svg{display:block;width:100%;filter:drop-shadow(0 8px 10px #0003);animation:pbob 3s ease-in-out infinite}
@keyframes pbob{50%{transform:translateY(-6px)}}
#pd .mo,#pd .tg{opacity:0;transform-box:fill-box;transform-origin:50% 0}
#pd.talk .mo,#pd.talk .tg{opacity:1;animation:mth .26s ease-in-out infinite alternate}
#pd.talk .sm{opacity:0}
@keyframes mth{from{transform:scaleY(.25)}to{transform:scaleY(1.1)}}
#pd .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
#pd.yay svg{animation:yay .7s}#pd.oops svg{animation:oops .5s}
@keyframes yay{30%{transform:translateY(-30px) rotate(-8deg)}60%{transform:translateY(0) rotate(6deg)}}
@keyframes oops{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#pd .bub{position:absolute;right:10px;bottom:100%;width:max-content;max-width:min(240px,64vw);background:var(--sf);border:2px solid var(--bl);border-radius:18px 18px 4px 18px;padding:8px 12px;font-weight:800;opacity:0;transform:translateY(8px) scale(.9);transition:.25s;pointer-events:none}
#pd .bub.on{opacity:1;transform:none}
@media(max-width:600px){#pd{width:88px}}
#pd.talk .jw{animation:jaw .26s ease-in-out infinite alternate}@keyframes jaw{to{transform:translateY(7px)}}
.wg{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin:12px auto;max-width:640px}
.wl{aspect-ratio:1;border-radius:12px;border:2px solid var(--bd);background:var(--sf);font-weight:800;font-size:clamp(14px,4.4vw,24px);display:grid;place-items:center;padding:0;text-align:center;transition:transform .12s,background .2s}
.wl.sel{background:var(--bl);color:#fff;border-color:var(--bl);transform:scale(1.08)}.wl.fd{background:var(--gr);color:#fff;border-color:var(--grs)}

function waveAssistant(){const d=$("#pd");if(!d)return;d.classList.remove("wave");void d.offsetWidth;d.classList.add("wave");setTimeout(()=>d.classList.remove("wave"),1900)}
function addPanda(){if($("#pd"))return;const d=document.createElement("div");d.id="pd";d.setAttribute("role","button");d.setAttribute("aria-label","English Master voice assistant");
 d.innerHTML=`<div class="bub" id="pbb"></div><div id="pcv"></div>`;
